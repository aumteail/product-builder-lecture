<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf9f2;
            --text-main: #333333;
            --text-muted: #666666;
            --primary: #ff8c00;
            --secondary: #ffb04f;
            --card-bg: #ffffff;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 3rem 2rem;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        header {
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .start-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 15px rgba(255, 140, 0, 0.3);
            margin-bottom: 2rem;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 140, 0, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        #webcam-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            min-height: 200px;
        }

        #webcam-container canvas {
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #label-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .prediction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 1rem 1.5rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 12px;
            background: #e9ecef;
            border-radius: 10px;
            margin: 0 1rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .prediction-value {
            min-width: 50px;
            text-align: right;
            color: var(--primary);
        }
        
        .loading {
            display: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: left; margin-bottom: 1.5rem;">
            <a href="index.html" style="text-decoration: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 700; background: #f4f4f4; padding: 0.5rem 1rem; border-radius: 12px; transition: background 0.2s;">← 로또 홈으로 가기</a>
        </div>
        <header>
            <h1>동물상 테스트</h1>
            <p>나는 강아지상일까, 고양이상일까?</p>
        </header>

        <button type="button" class="start-btn" id="startBtn" onclick="init()">카메라 켜기 / 시작</button>
        <div id="loading" class="loading">모델을 불러오고 카메라를 준비 중입니다...</div>
        
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <!-- Teachable Machine Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/hy6mSDyAH/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            // UI 변경
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("loading").style.display = "block";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(250, 250, flip); // 크기를 약간 키움
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // 로딩 UI 숨김
            document.getElementById("loading").style.display = "none";

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            
            // 예측 결과를 보여줄 막대그래프 UI 생성
            for (let i = 0; i < maxPredictions; i++) {
                const row = document.createElement("div");
                row.className = "prediction-row";
                
                const label = document.createElement("span");
                label.className = "prediction-label";
                
                const progressBg = document.createElement("div");
                progressBg.className = "progress-bar-bg";
                const progressFill = document.createElement("div");
                progressFill.className = "progress-bar-fill";
                progressBg.appendChild(progressFill);

                const value = document.createElement("span");
                value.className = "prediction-value";
                
                row.appendChild(label);
                row.appendChild(progressBg);
                row.appendChild(value);
                
                labelContainer.appendChild(row);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const row = labelContainer.childNodes[i];
                const probability = (prediction[i].probability * 100).toFixed(0);
                
                // 클래스명 (예: 강아지, 고양이)
                row.querySelector(".prediction-label").innerHTML = prediction[i].className;
                // 진행 바
                row.querySelector(".progress-bar-fill").style.width = probability + "%";
                // 퍼센트 수치
                row.querySelector(".prediction-value").innerHTML = probability + "%";
            }
        }
    </script>
</body>
</html>
